<div class="dark:text-white">
  <div class="max-w-6xl my-10 container mx-auto px-4 py-8">
    <div class="flex flex-wrap -mx-4">
      <!-- Product Images -->
      <div class="w-full md:w-1/2 px-4 mb-8">
        <!-- Main Image -->
        <div class="relative">
          <img
            [src]="allImages[currentImageIndex]"
            alt="{{vehicle.model}}"
            class="bg-gray-200 dark:bg-gray-800 w-full h-96 rounded-lg shadow-md mb-4 object-contain cursor-zoom-in hover:opacity-90 transition duration-300"
            (click)="toggleModal()"
          />
        </div>

        <!-- Thumbnails -->
        <div class="flex gap-4 py-4 justify-center overflow-x-auto">
          <img
            *ngFor="let imageUrl of allImages; let i = index"
            [src]="imageUrl"
            [alt]="'Thumbnail ' + (i + 1)"
            class="size-16 sm:size-20 object-cover rounded-md cursor-pointer opacity-60 hover:opacity-100 transition duration-300"
            (click)="changeImage(imageUrl)"
            [class.opacity-100]="currentImageIndex === (i + 1)"
          />
        </div>

        <!-- Full Screen Modal -->
        <div *ngIf="isModalOpen"
             class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center"
             (click)="toggleModal($event)">
          <!-- Modal Content -->
          <div class="h-full w-full flex items-center justify-center relative">
            <!-- Main Image Container -->
            <div class="relative w-full h-full flex items-center justify-center"
                 (click)="$event.stopPropagation()">
              <img
                [src]="allImages[currentImageIndex]"
                alt="Full size product image"
                class="max-h-screen max-w-full object-contain"
              />
            </div>

            <!-- Navigation Buttons -->
            <button
              class="absolute left-4 top-1/2 -translate-y-1/2 bg-red-500/40 hover:bg-red-500/60 text-white p-1 sm:p-6 rounded-full text-2xl transition-all duration-300 z-10"
              (click)="previousImage(); $event.stopPropagation()">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-8 w-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <button
              class="absolute right-4 top-1/2 -translate-y-1/2 bg-red-500/40 hover:bg-red-500/60 text-white p-1 sm:p-6 rounded-full text-2xl transition-all duration-300 z-10"
              (click)="nextImage(); $event.stopPropagation()">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-8 w-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>

            <!-- Close Button -->
            <button
              class="absolute top-4 right-4 text-white bg-white/10 hover:bg-white/20 rounded-full p-1 sm:p-4 text-xl transition-all duration-300 z-10"
              (click)="toggleModal($event)">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-8 w-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>

            <!-- Image Counter -->
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 text-white bg-black/50 px-4 py-2 rounded-full">
              {{ currentImageIndex + 1 }} / {{ allImages.length }}
            </div>
          </div>
        </div>
      </div>

      <!-- Product Details -->
      <div class="w-full md:w-1/2 px-4">
        <h2 class="text-3xl font-bold mb-2">{{vehicle.title}}</h2>
        <div class="mb-4">
          <span class="text-2xl font-bold mr-2">{{vehicle.price}} MAD</span>
        </div>
        <div class="flex items-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
               class="h-6 w-6 text-yellow-500" *ngFor="let _ of [1,2,3,4,5]">
            <path fill-rule="evenodd"
                  d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                  clip-rule="evenodd" />
          </svg>
          <span class="ml-2 text-gray-600">4.5 (120 reviews)</span>
        </div>
        <p class="text-gray-700 mb-6">{{vehicle.description}}</p>

        <div class="flex space-x-4 mb-6">
          <button
            class="bg-indigo-600 flex gap-2 items-center text-white px-6 py-2 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 5h15M3 12h10M3 19h15" />
            </svg>
            Add to Cart
          </button>
          <button
            class="bg-gray-200 flex gap-2 items-center text-gray-800 px-6 py-2 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
            </svg>
            Wishlist
          </button>
        </div>

        <div>
          <h3 class="text-lg font-semibold mb-2">Key Features:</h3>
          <ul class="list-disc list-inside text-gray-700">
            <li>Industry-leading noise cancellation</li>
            <li>30-hour battery life</li>
            <li>Touch sensor controls</li>
            <li>Speak-to-chat technology</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
