<div class="max-w-6xl mx-auto px-4 py-8 relative">
  <!-- Carrousel -->
  <div class="relative overflow-hidden rounded-xl">
    <div
      class="flex transition-transform duration-500 ease-in-out"
      [style.transform]="'translateX(-' + currentSlide * 100 + '%)'"
    >
      <div *ngFor="let slide of slides" class="min-w-full relative">
        <img [src]="slide.image" [alt]="slide.title" class="w-full h-[600px] object-cover" />
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-6">
          <h2 class="text-white text-3xl font-bold">{{ slide.title }}</h2>
          <p class="text-gray-200 mt-2">{{ slide.description }}</p>
        </div>
      </div>
    </div>

    <!-- Boutons de navigation -->
    <button
      (click)="previous()"
      class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white p-2 rounded-full shadow-lg"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
      </svg>
    </button>

    <button
      (click)="next()"
      class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white p-2 rounded-full shadow-lg"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </button>

    <!-- Indicateurs -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2">
      <button
        *ngFor="let slide of slides; let i = index"
        (click)="goToSlide(i)"
        class="w-3 h-3 rounded-full"
        [ngClass]="{ 'bg-white': currentSlide === i, 'bg-white/60 hover:bg-white': currentSlide !== i }"
      ></button>
    </div>
  </div>
</div>
