<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-40 dark:bg-opacity-70">
  <!-- Modal Content -->
  <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto dark:bg-gray-800 dark:text-gray-100">
    <div class="flex justify-between items-center p-6 border-b dark:border-gray-700">
      <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-100">Update Vehicle</h2>
      <button class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200"
              (click)="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form class="p-6" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Code Car -->
        <div>
          <label for="codeCar" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">
            Code Car
          </label>
          <input
            [(ngModel)]="vehicle.codeCar"
            type="text"
            id="codeCar"
            name="codeCar"
            placeholder="MB-2024-XYZ"
            class="w-full px-3 py-2 border text-black border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 dark:focus:ring-blue-600"
            required
          />
        </div>

        <!-- Mark -->
        <div>
          <label for="mark" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">
            Mark
          </label>
          <input
            [(ngModel)]="vehicle.mark"
            type="text"
            id="mark"
            name="mark"
            placeholder="Mercedes-Benz"
            class="w-full px-3 py-2 border text-black border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 dark:focus:ring-blue-600"
            required
          />
        </div>

        <!-- Model -->
        <div>
          <label for="model" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">
            Model
          </label>
          <input
            [(ngModel)]="vehicle.model"
            type="text"
            id="model"
            name="model"
            placeholder="Sprinter"
            class="w-full px-3 py-2 border text-black border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 dark:focus:ring-blue-600"
            required
          />
        </div>

        <!-- Telephone -->
        <div>
          <label for="telephone" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">
            Telephone
          </label>
          <input
            [(ngModel)]="vehicle.telephone"
            type="tel"
            id="telephone"
            name="telephone"
            placeholder="0555-678912"
            class="w-full px-3 py-2 border text-black border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 dark:focus:ring-blue-600"
            required
          />
        </div>

        <!-- Price -->
        <div>
          <label for="price" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">
            Price
          </label>
          <input
            [(ngModel)]="vehicle.price"
            type="number"
            id="price"
            name="price"
            placeholder="400.0"
            class="w-full px-3 py-2 border text-black border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 dark:focus:ring-blue-600"
            required
          />
        </div>

        <!-- City -->
        <div>
          <label for="city" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">
            City
          </label>
          <input
            [(ngModel)]="vehicle.city"
            type="text"
            id="city"
            name="city"
            placeholder="Rabat"
            class="w-full px-3 py-2 border text-black border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 dark:focus:ring-blue-600"
            required
          />
        </div>

        <!-- Fuel Type -->
        <div>
          <label for="fuelType" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">
            Fuel Type
          </label>
          <select
            [(ngModel)]="vehicle.fuelType"
            id="fuelType"
            name="fuelType"
            class="text-gray-700 mb-1 dark:text-gray-300 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-blue-600"
            required
          >
            <option value="HYBRID">HYBRID</option>
            <option value="ELECTRIC">ELECTRIC</option>
            <option value="PETROL">PETROL</option>
            <option value="DIESEL">DIESEL</option>
          </select>
        </div>

        <!-- Year -->
        <div>
          <label for="year" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">
            Year
          </label>
          <input
            [(ngModel)]="vehicle.year"
            type="number"
            id="year"
            name="year"
            placeholder="2005"
            min="1900"
            max="2025"
            class="w-full px-3 py-2 border text-black border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 dark:focus:ring-blue-600"
            required
          />
        </div>
      </div>

      <div class="mt-6">
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">
          Description
        </label>
        <textarea
          [(ngModel)]="vehicle.description"
          id="description"
          name="description"
          rows="3"
          placeholder="Fourgon utilitaire spacieux, idéal pour le transport de marchandises."
          class="w-full px-3 py-2 border text-black  border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 dark:focus:ring-blue-600"
          required
        ></textarea>
      </div>

      <!-- Image Upload -->
      <div class="mt-6">
        <label class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300">
          Vehicle Images
        </label>
        <div class="border-2 border-dashed border-gray-300 rounded-md p-6 flex flex-col items-center dark:border-gray-600">
          <!-- SVG Upload Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8 text-gray-400 mb-2 dark:text-gray-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-4m0 0V8m0 4h4m-4 0H8m6 4H6a2 2 0 01-2-2V6a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2h-6z"/>
          </svg>

          <p class="text-sm text-gray-500 mb-2 dark:text-gray-400">Drag and drop images here, or click to select files</p>

          <!-- Hidden File Input -->
          <input
            type="file" id="images" name="images" multiple accept="image/*" (change)="onFileChange($event)" class="hidden" />

          <!-- Button that triggers file input -->
          <button type="button"
                  class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors dark:bg-gray-700 dark:text-gray-100 dark:hover:bg-gray-600"
                  (click)="triggerFileInput()">
            Select Files
          </button>

          <!-- Display number of selected files -->
          <p *ngIf="fileCount > 0" class="mt-3 text-sm text-gray-500 dark:text-gray-400">{{ fileCount }} file(s) selected</p>
          <p *ngIf="fileCount === 0" class="mt-3 text-sm text-gray-500 dark:text-gray-400">No files selected</p>
        </div>
      </div>

      <!-- Preview Images -->
      <div class="mt-4">
        <p class="text-sm font-medium text-gray-700 mb-2 dark:text-gray-300">Selected Images:</p>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <!-- Image previews with delete button -->
          <div *ngFor="let image of imagePreviews; let i = index" class="relative">
            <img [src]="image" alt="Preview" class="w-full h-full object-cover rounded-md" />

            <!-- Delete button for each image -->
            <button
              type="button"
              (click)="removeImage(i)"
              class="absolute top-2 right-2 p-1 bg-red-500 text-white rounded-full hover:bg-red-600"
            >
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Display error when more than 5 images are selected -->
      <p *ngIf="imagePreviews.length < 3" class="text-red-500 text-sm">You must select at least 3 images.</p>
      <p *ngIf="imagePreviews.length > 5" class="text-red-500 text-sm">You can only select up to 5 images.</p>




      <!-- Submit Button -->
      <div class="mt-8 flex justify-end">
        <button
          type="button"
          class="px-4 py-2 mr-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors dark:bg-gray-700 dark:text-gray-100 dark:hover:bg-gray-600"
          (click)="closeModal()"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors dark:bg-blue-700 dark:hover:bg-blue-800"
        >
          Add Vehicle
        </button>
      </div>
    </form>

  </div>

</div>
