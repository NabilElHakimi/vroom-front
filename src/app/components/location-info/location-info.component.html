<div class="bg-gradient-to-r px-0 sm:px-44  py-6 border-b bg-white dark:bg-gray-800 border-slate-300 dark:border-slate-700">
  <div class="container mx-auto px-4 md:px-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between">
      <div class="mb-4 md:mb-0">
        <h1 class="text-2xl md:text-3xl font-semibold text-gray-900 dark:text-gray-100">
          {{location?.name}}
        </h1>
        <div class="flex items-center mt-1 text-slate-600 dark:text-slate-300">
          <svg class="w-4 h-4 mr-2 text-teal-600 dark:text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span >{{location?.city}}</span>
        </div>
      </div>

      <div class="flex flex-col md:flex-row md:space-x-6 text-sm">
        <div class="flex items-center mb-2 md:mb-0 group">
          <div class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-300 dark:bg-slate-700 group-hover:bg-teal-500/20 transition-colors mr-2">
            <svg class="w-4 h-4 text-teal-600 dark:text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </div>
          <span class="text-slate-600 dark:text-slate-300 group-hover:text-black dark:group-hover:text-white transition-colors">{{location?.address}}</span>
        </div>

        <div class="flex items-center mb-2 md:mb-0 group">
          <div class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-300 dark:bg-slate-700 group-hover:bg-teal-500/20 transition-colors mr-2">
            <svg class="w-4 h-4 text-teal-600 dark:text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
            </svg>
          </div>
          <span class="text-slate-600 dark:text-slate-300 group-hover:text-black dark:group-hover:text-white transition-colors">{{location?.telephone}}</span>
        </div>

        <div class="flex items-center group">
          <div class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-300 dark:bg-slate-700 group-hover:bg-teal-500/20 transition-colors mr-2">
            <svg class="w-4 h-4 text-teal-600 dark:text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
          </div>
          <span class="text-slate-600 dark:text-slate-300 group-hover:text-black dark:group-hover:text-white transition-colors">{{location?.email}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
