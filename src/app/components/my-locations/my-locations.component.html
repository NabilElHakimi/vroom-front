<div class="min-h-[75vh] flex justify-center items-center p-4 ">
  <div class="w-full max-w-md rounded-lg shadow-xl transition-all duration-300 dark:bg-gray-800 bg-white overflow-hidden">
    <div class="p-5 border-b dark:border-gray-700 border-gray-200 flex justify-between items-center">
      <h1 class="text-2xl font-bold dark:text-white text-gray-800">My Locations</h1>
      <button class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 dark:text-white text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
        </svg>
      </button>
    </div>

    <div class="p-5 max-h-[70vh] overflow-y-auto">
      <div class="space-y-3">
        <div *ngFor="let lo of locations" class="location-card rounded-lg overflow-hidden shadow-md dark:bg-gray-900/85 bg-white hover:bg-gray-100 dark:hover:bg-gray-900/50 cursor-pointer">
          <div routerLink = "/client/location/{{lo.id}}" class="p-4 flex items-center">
            <div class="w-12 h-12 rounded-full bg-red-500 flex items-center justify-center mr-4 shadow-md">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white location-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <div class="flex-1">
              <h3 class="text-lg font-medium dark:text-white text-gray-800">{{lo.name}}</h3>
              <p class="text-xl font-bold dark:text-red-300 text-red-600">{{lo.city}}</p>
            </div>
<!--            <div class="ml-2">-->
<!--              <button class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">-->
<!--                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 dark:text-gray-400 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">-->
<!--                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />-->
<!--                </svg>-->
<!--              </button>-->
<!--            </div>-->
          </div>
        </div>
      </div>

      <div *ngIf="locations.length === 0" class="text-center py-8">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-400 dark:text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <p class="mt-4 text-gray-600 dark:text-gray-400">No locations found</p>
        <button class="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
          Add Your First Location
        </button>
      </div>
    </div>


  </div>
</div>
