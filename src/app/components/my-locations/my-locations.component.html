<div class="inset-0  bg-opacity-50 flex justify-center items-center z-50">
  <div class="w-full max-w-md rounded-lg shadow-xl transition-all duration-300 dark:bg-gray-800 bg-white">
    <div class="p-5 border-b dark:border-gray-700 border-gray-200 flex justify-between items-center">
      <h1 class="text-2xl font-bold dark:text-white text-gray-800">My Locations</h1>

    </div>

    <div class="p-5">
      <div class="space-y-4" *ngFor="let lo of locations">
        <div class="rounded-lg overflow-hidden shadow-md transition-all hover:shadow-lg cursor-pointer dark:bg-gray-700 bg-white border dark:border-gray-600 border-gray-200">
          <div class="p-4 flex items-center">
            <div class="w-12 h-12 rounded-full bg-blue-500 flex items-center justify-center mr-4">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-medium dark:text-white text-gray-800">{{lo.name}}</h3>
              <p class="text-xl font-bold dark:text-blue-300 text-blue-600">{{lo.city}}</p>
            </div>
          </div>
        </div>
    </div>

    <!-- Modal Footer -->
    <div class="p-4 flex justify-between border-t dark:border-gray-700 border-gray-200">
      <button class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
        Cancel
      </button>
      <button class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:bg-blue-600 transition-colors">
        Add New Location
      </button>
    </div>
  </div>
</div>
</div>
