<div class="bg-white dark:bg-gray-800 shadow-md rounded-lg mx-auto max-w-6xl mt-28">
  <div class="bg-red-500 text-white p-4 rounded-t-lg">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold">Profile</h2>
      <div class="flex space-x-2">
<!--        <button class="px-3 py-1 bg-white text-red-500 rounded-md text-sm font-medium hover:bg-red-50">-->
<!--          Edit-->
<!--        </button>-->
<!--        <button class="px-3 py-1 bg-red-600 text-white rounded-md text-sm font-medium hover:bg-red-700">-->
<!--          Settings-->
<!--        </button>-->
      </div>
    </div>
  </div>

  <div class="p-6 flex flex-wrap items-center">
    <div class="flex items-center mr-8">
      <div class="h-16 w-16 bg-red-500 rounded-full flex items-center justify-center text-white text-xl font-bold">
        NH
      </div>
    </div>

    <div class="flex flex-col mr-8 py-2">
      <span class="text-sm text-gray-500 dark:text-gray-400">Name</span>
      <span class="font-medium text-gray-900 dark:text-white">{{profile.user?.first_name}} {{profile.user?.last_name}}</span>
    </div>

    <div class="flex flex-col mr-8 py-2">
      <span class="text-sm text-gray-500 dark:text-gray-400">Username</span>
      <span class="font-medium text-gray-900 dark:text-white">{{profile.user?.username}}</span>
    </div>

    <div class="flex flex-col mr-8 py-2">
      <span class="text-sm text-gray-500 dark:text-gray-400">Email</span>
      <span class="font-medium text-gray-900 dark:text-white">{{profile.user?.email}}</span>
    </div>


    <div class="flex flex-col py-2">
      <span class="text-sm text-gray-500 dark:text-gray-400">Status</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
        Active
      </span>
    </div>
  </div>
</div>

<h1 class="w-full text-center font-bold text-4xl dark:text-white text-black mt-6">My Reservations</h1>

<app-reservation-table [reservations]="profile.reservations"></app-reservation-table>
