<div class="w-screen h-screen flex justify-center items-center z-50 fixed bg-black/80 backdrop-blur-sm" *ngIf="leaderPropositionAlert">
  <div class="rounded-lg shadow-lg relative max-w-md w-full bg-white dark:bg-gray-800 ">
    <div class="flex justify-end p-3">
      <button
        (click)="closeAlert()"
        type="button"
        class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center transition-colors duration-200"
      >
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          ></path>
        </svg>
      </button>
    </div>

    <div class="p-6 pt-0 text-center">
      <!-- Animated SVG Icon -->
      <svg
        class="w-20 h-20 text-blue-600 mx-auto animate-bounce"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 4v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        ></path>
      </svg>

      <!-- Modal Title -->
      <h3 class="text-2xl font-semibold text-gray-800 dark:text-white mt-5 mb-6">
        Become a Leader on <span class="text-blue-600">Vroom</span>!
      </h3>

      <p class="text-gray-600 dark:text-gray-300 mb-6">
        Unlock the ability to list your vehicles for rental and start earning.
      </p>

      <!-- Action Buttons -->
      <div class="flex justify-center space-x-4">
        <a
          class="cursor-pointer text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-base inline-flex items-center px-5 py-2.5 text-center transition-all duration-200 transform hover:scale-105"
        >
          Yes, I want to be a leader
        </a>
        <a
          (click)="closeAlert()"
          class="cursor-pointer text-gray-900 bg-white hover:bg-gray-100 focus:ring-4 focus:ring-gray-200 border border-gray-200 font-medium rounded-lg text-base inline-flex items-center px-5 py-2.5 text-center transition-all duration-200 transform hover:scale-105"
        >
          No, cancel
        </a>
      </div>
    </div>
  </div>
</div>
